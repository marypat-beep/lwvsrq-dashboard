// ---------- helpers ----------
function nr(v) { return (v === null || v === undefined) ? '<span class="nr-value">N/R</span>' : v; }
function num(v, digits) {
  if (v === null || v === undefined) return '<span class="nr-value">N/R</span>';
  const n = Number(v);
  if (!isFinite(n)) return '<span class="nr-value">N/R</span>';
  if (digits === undefined) return n.toLocaleString(undefined, {maximumFractionDigits: 1});
  return n.toLocaleString(undefined, {minimumFractionDigits: digits, maximumFractionDigits: digits});
}
function pctText(pct) {
  if (pct === null || pct === undefined) return '&mdash;';
  const sign = pct >= 0 ? '+' : '';
  return sign + pct.toFixed(0) + '%';
}
function deltaClass(delta) {
  if (delta > 0.5) return 'delta-up';
  if (delta < -0.5) return 'delta-down';
  return 'delta-flat';
}
function fmtDate(s) {
  if (!s) return '<span class="nr-value">N/R</span>';
  return s;
}

// ---------- tab machinery ----------
const tabs = [
  {id: 'overview', label: 'Overview', render: renderOverview},
  {id: 'q1q2', label: 'Q1 vs Q2', render: renderQ1Q2},
];
TEAM_TABS.forEach(([key, label]) => tabs.push({id: 'team_' + key, label: label, render: () => renderTeam(key, label)}));

function initTabs() {
  const bar = document.getElementById('tabBar');
  tabs.forEach((tab, i) => {
    const btn = document.createElement('button');
    btn.textContent = tab.label;
    btn.dataset.tab = tab.id;
    if (i === 0) btn.classList.add('active');
    btn.onclick = () => switchTab(tab.id);
    bar.appendChild(btn);
  });
  const main = document.getElementById('mainContent');
  tabs.forEach((tab, i) => {
    const div = document.createElement('div');
    div.className = 'tab-content' + (i === 0 ? ' active' : '');
    div.id = 'tab_' + tab.id;
    main.appendChild(div);
    tab.render(div);
  });
}

function switchTab(id) {
  document.querySelectorAll('.tab-bar button').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab_' + id));
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function renderTeam(key, label) {
  return function(div) {
    const details = DATA.details[key] || [];
    const q1Rows = details.filter(r => r.quarter === 'Q1');
    const q2Rows = details.filter(r => r.quarter === 'Q2');
    const hoursQ1 = DATA.q1.hours_by_team[label] || 0;
    const hoursQ2 = DATA.q2.hours_by_team[label] || 0;

    let kpis = teamKPIs(key, hoursQ1, hoursQ2);

    let html = `<h2 class="section-title">${label}</h2>`;
    html += `<div class="kpi-grid">${kpis}</div>`;

    if (hoursQ1 === 0 && hoursQ2 === 0) {
      html += `<div class="note-box">No volunteer hours reported for this team in Q1 or Q2. Activity data is captured below.</div>`;
    }

    html += `<h3 class="subhead">Q2 activities (${q2Rows.length})</h3>`;
    html += teamTable(key, q2Rows);
    html += `<h3 class="subhead">Q1 activities (${q1Rows.length})</h3>`;
    html += teamTable(key, q1Rows);

    div.innerHTML = html;
    makeTablesSortable(div);
  };
}

function teamKPIs(key, hoursQ1, hoursQ2) {
  const m = DATA.metrics[key];
  const items = [];
  items.push({label: 'Q2 volunteer hours', v: num(hoursQ2, 1), q1v: hoursQ1, q2v: hoursQ2});
  if (key === 'voter_services') {
    items.push({label: 'Q2 people engaged', v: num(m.Q2.people_engaged), q1v: m.Q1.people_engaged, q2v: m.Q2.people_engaged});
    items.push({label: 'Q2 VBM forms provided', v: num(m.Q2.vbm_given), q1v: m.Q1.vbm_given, q2v: m.Q2.vbm_given});
    items.push({label: 'Q2 tabling events', v: num(m.Q2.count), q1v: m.Q1.count, q2v: m.Q2.count});
  } else if (key === 'speakers_bureau') {

    items.push({label: 'Q2 total reach', v: num((m.Q2.live_attendees||0)+(m.Q2.virtual_attendees||0)), q1v: (m.Q1.live_attendees||0)+(m.Q1.virtual_attendees||0), q2v: (m.Q2.live_attendees||0)+(m.Q2.virtual_attendees||0)});
  } else if (key === 'education_action_team') {

    items.push({label: 'Q2 people reached', v: num(m.Q2.people_reached), q1v: m.Q1.people_reached, q2v: m.Q2.people_reached});
  } else if (key === 'membership') {
    items.push({label: 'Q2 events', v: num(m.Q2.count), q1v: m.Q1.count, q2v: m.Q2.count});
    items.push({label: 'Q2 attending', v: num(m.Q2.attending), q1v: m.Q1.attending, q2v: m.Q2.attending});
    items.push({label: 'Q2 new members', v: num(m.Q2.new_members), q1v: m.Q1.new_members, q2v: m.Q2.new_members});
  } else if (key === 'gotv') {
    items.push({label: 'Q2 partner interactions', v: num(m.Q2.count), q1v: m.Q1.count, q2v: m.Q2.count});
    items.push({label: 'Q2 active deployments', v: num(m.Q2.active_deployments), q1v: m.Q1.active_deployments, q2v: m.Q2.active_deployments});

    items.push({label: 'Q2 total reach', v: num((m.Q2.live||0)+(m.Q2.virtual||0)+(m.Q2.views_30day||0)), q1v: (m.Q1.live||0)+(m.Q1.virtual||0)+(m.Q1.views_30day||0), q2v: (m.Q2.live||0)+(m.Q2.virtual||0)+(m.Q2.views_30day||0)});
  } else if (key === 'vote411') {
    items.push({label: 'Q2 activities', v: num(m.Q2.count), q1v: m.Q1.count, q2v: m.Q2.count});
    items.push({label: 'Q2 candidate profiles', v: num(m.Q2.candidate_count), q1v: m.Q1.candidate_count, q2v: m.Q2.candidate_count});
  } else if (key === 'social_media') {
    items.push({label: 'Q2 reach', v: num(m.Q2.reach), q1v: m.Q1.reach, q2v: m.Q2.reach});
    items.push({label: 'Q2 engagement', v: num(m.Q2.engagement), q1v: m.Q1.engagement, q2v: m.Q2.engagement});
    items.push({label: 'Q2 audience size', v: num(m.Q2.audience), q1v: m.Q1.audience, q2v: m.Q2.audience});
  } else if (key === 'editorial_essays') {
    items.push({label: 'Q2 publications', v: num(m.Q2.count), q1v: m.Q1.count, q2v: m.Q2.count});
  } else if (key === 'rallies') {

// ---------- Table sorting ----------
function makeTablesSortable(container) {
  container.querySelectorAll('table.sortable').forEach(table => {
    const headers = table.querySelectorAll('thead th');
    headers.forEach((th, idx) => {
      th.addEventListener('click', () => {
        const asc = !th.classList.contains('sort-asc');
        headers.forEach(h => h.classList.remove('sort-asc', 'sort-desc'));
        th.classList.add(asc ? 'sort-asc' : 'sort-desc');
        const tbody = table.querySelector('tbody');
        const rows = Array.from(tbody.querySelectorAll('tr'));
        const type = th.dataset.sort;
        rows.sort((a, b) => {
          const av = a.children[idx].dataset.value !== undefined ? a.children[idx].dataset.value : a.children[idx].textContent;
          const bv = b.children[idx].dataset.value !== undefined ? b.children[idx].dataset.value : b.children[idx].textContent;
          if (type === 'num') {
            const na = parseFloat(av) || 0;
            const nb = parseFloat(bv) || 0;
            return asc ? na - nb : nb - na;
          }
          return asc ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
        });
        rows.forEach(r => tbody.appendChild(r));
      });
    });
  });
}

        {label: 'Q2', data: all.map(t => DATA.q2.hours_by_team[t] || 0), backgroundColor: '#eca400'}
      ]
    },
    options: {indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: {legend: {position: 'bottom'}}, scales: {x: {beginAtZero: true, title: {display: true, text: 'Hours'}}}}
  });
}

function drawChartQ1Q2Cat() {
  const cats = ['Election', 'Non-Election', 'Admin'];
  new Chart(document.getElementById('chartQ1Q2Cat'), {
    type: 'bar',
    data: {
      labels: cats,
      datasets: [
        {label: 'Q1', data: cats.map(c => DATA.q1.hours_by_cat[c]), backgroundColor: '#9a1a75'},
        {label: 'Q2', data: cats.map(c => DATA.q2.hours_by_cat[c]), backgroundColor: '#eca400'}
      ]
    },
    options: {responsive: true, maintainAspectRatio: false, plugins: {legend: {position: 'bottom'}}, scales: {y: {beginAtZero: true, title: {display: true, text: 'Hours'}}}}
  });
}

initTabs();
</script>
